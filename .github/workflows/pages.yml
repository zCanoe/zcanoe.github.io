name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_site.py
      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          request = Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/pages', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
          })
          try:
              with urlopen(request, timeout=30) as response:
                  enabled = response.status == 200
          except HTTPError as error:
              if error.code != 404:
                  raise
              enabled = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('enabled=' + str(enabled).lower() + '\n')
          if not enabled:
              print('Pages is not enabled. Validation succeeded; deployment is skipped. Private repositories require an eligible GitHub plan.')
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.repository == 'zCanoe/zcanoe.github.io'
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_enabled == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.repository == 'zCanoe/zcanoe.github.io'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

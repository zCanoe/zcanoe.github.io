name: One-time privacy maintenance

on:
  workflow_dispatch:
    inputs:
      previous_email:
        description: Contact address to remove from history
        required: true
        type: string
      replacement_email:
        description: Replacement public contact address
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    if: github.repository == 'zCanoe/zcanoe.github.io' && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      deployments: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install git-filter-repo==2.47.0
      - name: Rewrite, verify and remove obsolete deployment artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_CONTACT: ${{ inputs.previous_email }}
          NEW_CONTACT: ${{ inputs.replacement_email }}
        shell: python
        run: |
          """One-time repository cleanup, run only by the owner in GitHub Actions."""
          import base64
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          
          
          def git(folder, *args, env=None):
              return subprocess.check_output(["git", "-C", str(folder), *args], env=env)
          
          
          def audit(folder, needles):
              found = []
              objects = git(folder, "rev-list", "--objects", "--all").splitlines()
              for row in objects:
                  oid = row.split(b" ", 1)[0].decode()
                  kind = git(folder, "cat-file", "-t", oid).strip()
                  if kind not in (b"blob", b"commit", b"tag"):
                      continue
                  data = git(folder, "cat-file", "-p", oid).lower()
                  if any(needle.lower() in data for needle in needles):
                      found.append(oid)
              return found
          
          
          def rewrite(folder, old, new):
              if not re.fullmatch(r"[^\s@]+@[^\s@]+", old) or not re.fullmatch(r"[^\s@]+@[^\s@]+", new):
                  raise ValueError("Expected two email addresses")
              needles = [old.encode()]
              replacements = [(old, new)]
              local, domain = old.rsplit("@", 1)
              if domain.lower() == "qq.com" and local.isdigit():
                  needles.append(local.encode())
                  replacements.append((local, new.split("@", 1)[0]))
              before = audit(folder, needles)
              with tempfile.TemporaryDirectory() as temp:
                  rules = Path(temp) / "rules.txt"
                  rules.write_text("".join("regex:(?i)" + re.escape(a) + "==>" + b + "\n" for a, b in replacements), encoding="utf-8")
                  callback = ('import os\nreturn os.environ["NEW_CONTACT"].encode() '
                              'if email.lower() == os.environ["OLD_CONTACT"].lower().encode() else email')
                  env = {**os.environ, "OLD_CONTACT": old, "NEW_CONTACT": new}
                  subprocess.run([sys.executable, "-m", "git_filter_repo", "--force", "--replace-text", str(rules),
                                  "--replace-message", str(rules), "--email-callback", callback], cwd=folder, env=env, check=True)
              after = audit(folder, needles)
              if after:
                  raise RuntimeError("Audit failed: obsolete contact remains in reachable history")
              print(f"Audit passed: sanitized {len(before)} objects; zero matching objects remain.")
              return needles
          
          
          def api(path, method="GET", data=None):
              repo = os.environ["GITHUB_REPOSITORY"]
              payload = json.dumps(data).encode() if data is not None else None
              request = Request(f"https://api.github.com/repos/{repo}/{path}", data=payload, method=method,
                                headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                                         "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
                                         "Content-Type": "application/json"})
              with urlopen(request, timeout=60) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None
          
          
          def all_pages(path, key=None):
              result = []
              for page in range(1, 101):
                  separator = "&" if "?" in path else "?"
                  batch = api(f"{path}{separator}per_page=100&page={page}")
                  items = batch[key] if key else batch
                  result.extend(items)
                  if len(items) < 100:
                      return result
              raise RuntimeError("Pagination exceeded expected repository size")
          
          
          def run():
              repo = os.environ["GITHUB_REPOSITORY"]
              if repo != "zCanoe/zcanoe.github.io" or os.environ["GITHUB_ACTOR"].lower() != "zcanoe":
                  raise RuntimeError("Owner and repository mismatch")
              old, new = os.environ["OLD_CONTACT"], os.environ["NEW_CONTACT"]
              # Never print the obsolete value into retained logs.
              print("::add-mask::" + old)
              print("::add-mask::" + old.split("@", 1)[0])
              token = base64.b64encode(("x-access-token:" + os.environ["GH_TOKEN"]).encode()).decode()
              auth_env = {**os.environ, "GIT_CONFIG_COUNT": "1", "GIT_CONFIG_KEY_0": "http.https://github.com/.extraheader",
                          "GIT_CONFIG_VALUE_0": "AUTHORIZATION: basic " + token}
              remote = "https://github.com/" + repo + ".git"
              with tempfile.TemporaryDirectory() as temp:
                  mirror = Path(temp) / "repository.git"
                  subprocess.run(["git", "clone", "--mirror", remote, str(mirror)], env=auth_env, check=True)
                  refs = git(mirror, "for-each-ref", "--format=%(refname) %(objectname)", "refs/heads", "refs/tags").decode().splitlines()
                  original_refs = dict(row.split(" ", 1) for row in refs)
                  if "refs/heads/main" not in original_refs:
                      raise RuntimeError("Missing main branch")
                  needles = rewrite(mirror, old, new)
                  # Test the rewritten main before changing remote references.
                  check = Path(temp) / "validation"
                  subprocess.run(["git", "clone", "--branch", "main", str(mirror), str(check)], check=True)
                  subprocess.run([sys.executable, "-m", "pip", "install", "-r", str(check / "requirements.txt")], check=True)
                  subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", "tests", "-v"], cwd=check, check=True)
                  subprocess.run([sys.executable, "scripts/build_site.py"], cwd=check, check=True)
                  for item in (check / "_site").rglob("*"):
                      if item.is_file() and any(needle.lower() in item.read_bytes().lower() for needle in needles):
                          raise RuntimeError("Obsolete value remains in public output")
                  subprocess.run(["git", "-C", str(mirror), "remote", "add", "origin", remote], check=True)
                  # Exact leases protect any work submitted after this maintenance clone.
                  leases = [f"--force-with-lease={ref}:{oid}" for ref, oid in original_refs.items()]
                  refspecs = [f"{ref}:{ref}" for ref in original_refs]
                  subprocess.run(["git", "-C", str(mirror), "push", "--atomic", *leases, "origin", *refspecs], env=auth_env, check=True)
                  # Verify server branch/tag tips match the audited local history.
                  server = git(mirror, "ls-remote", "--heads", "--tags", "origin", env=auth_env).decode().splitlines()
                  server_refs = {row.split()[1]: row.split()[0] for row in server if not row.split()[1].endswith("^{}")}
                  for ref in original_refs:
                      if server_refs.get(ref) != git(mirror, "rev-parse", ref).decode().strip():
                          raise RuntimeError("Remote reference verification failed")
                  print("Rewritten and verified branch/tag refs:", ", ".join(original_refs))
                  print("GitHub-owned pull request refs require GitHub Support for server-side purging.")
          
              current_id = int(os.environ["GITHUB_RUN_ID"])
              runs = all_pages("actions/runs", "workflow_runs")
              removed_runs = []
              for item in runs:
                  if item["id"] < current_id and item["status"] == "completed":
                      api(f'actions/runs/{item["id"]}', method="DELETE")
                      removed_runs.append(item["id"])
              deployments = all_pages("deployments")
              removed_deployments = []
              for item in deployments:
                  api(f'deployments/{item["id"]}/statuses', method="POST", data={"state": "inactive"})
                  api(f'deployments/{item["id"]}', method="DELETE")
                  removed_deployments.append(item["id"])
              summary = ("## Privacy maintenance completed\n\n"
                         "- Ordinary branch and tag history rewritten and audited: no obsolete contact matches.\n"
                         "- Rewritten main passed the existing tests and static build.\n"
                         f"- Deleted previous completed Actions runs (including their artifacts): {removed_runs}.\n"
                         f"- Deleted previous deployment records: {removed_deployments}.\n"
                         "- Read-only PR references and server caches need GitHub Support; external copies are outside repository control.\n")
              Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          
          
          if __name__ == "__main__":
              run()
